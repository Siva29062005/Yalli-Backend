# Local development / CI infrastructure. Every published port is bound to 127.0.0.1.
# Required variables come from .env (see .env.example); compose fails fast if any is missing.
name: yalli

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: yalli
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?set in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set in .env}
      POSTGRES_REPORTING_PASSWORD: ${POSTGRES_REPORTING_PASSWORD:?set in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yalli"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes: ["rabbitmqdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  # One-shot: applies migrations with the DDL-capable role. Run: docker compose --profile tools run --build --rm migrate
  migrate:
    profiles: ["tools"]
    build: { context: ., target: migrate }
    environment:
      DATABASE_MIGRATION_URL: postgresql://yalli_migrator:${POSTGRES_MIGRATOR_PASSWORD:?set in .env}@postgres:5432/yalli
      # the local Postgres has no TLS; the image requires a verified connection everywhere else (AWS)
      MIGRATE_REQUIRE_VERIFIED_TLS: "0"
    depends_on:
      postgres: { condition: service_healthy }

  # One-shot: syncs roles/permissions and (optionally) creates the first SUPER_ADMIN from BOOTSTRAP_ADMIN_* in .env.
  # Uses the runtime (DML-only) credentials: seeding never needs DDL rights.
  seed:
    profiles: ["tools"]
    build: { context: ., target: runtime }
    env_file: .env
    command: ["node", "dist/cli/seed.js"]
    environment:
      # .env also holds the migrator and superuser credentials (for migrate and postgres): never give them to the app.
      DATABASE_MIGRATION_URL: ""
      POSTGRES_SUPERUSER_PASSWORD: ""
      POSTGRES_MIGRATOR_PASSWORD: ""
      POSTGRES_APP_PASSWORD: ""
      POSTGRES_REPORTING_PASSWORD: ""
      NODE_ENV: development
      LOG_PRETTY: "false"
      DATABASE_URL: postgresql://yalli_app:${POSTGRES_APP_PASSWORD}@postgres:5432/yalli
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      DATABASE_SSL: "false"
      CORS_ALLOWED_ORIGINS: ""
      SWAGGER_ENABLED: "false"
      # A one-off job: no broker connection and no background timers.
      EVENT_BUS_DRIVER: memory
      BACKGROUND_JOBS_ENABLED: "false"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  app:
    profiles: ["app"]
    build: { context: ., target: runtime }
    restart: unless-stopped
    env_file: .env
    environment:
      # Local smoke test of the production IMAGE. NODE_ENV stays "development" on purpose: the real
      # production guards (https CORS origins, TLS to the database) would - correctly - refuse to
      # start against this plain-TCP local Postgres. Production deploys run with NODE_ENV=production.
      # .env also holds the migrator and superuser credentials (for migrate and postgres): never give them to the app.
      DATABASE_MIGRATION_URL: ""
      POSTGRES_SUPERUSER_PASSWORD: ""
      POSTGRES_MIGRATOR_PASSWORD: ""
      POSTGRES_APP_PASSWORD: ""
      POSTGRES_REPORTING_PASSWORD: ""
      NODE_ENV: development
      LOG_PRETTY: "false"
      DATABASE_URL: postgresql://yalli_app:${POSTGRES_APP_PASSWORD}@postgres:5432/yalli
      REPORTING_DATABASE_URL: postgresql://yalli_reporting:${POSTGRES_REPORTING_PASSWORD}@postgres:5432/yalli
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      DATABASE_SSL: "false"   # in-compose traffic only; production requires true (enforced by env validation)
      SWAGGER_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: ""
      # The root filesystem is read-only; development image uploads go to the tmpfs (production: object store).
      UPLOADS_DIR: /tmp/uploads
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
